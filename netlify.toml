[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  included_files = ["public/data/reports/**"]

[[redirects]]
  from = "/api/wrapped/feedback"
  to = "/.netlify/functions/submit-feedback"
  status = 200

[[redirects]]
  from = "/api/wrapped/analytics"
  to = "/.netlify/functions/submit-analytics"
  status = 200

[[redirects]]
  from = "/api/wrapped/reporting/feedback"
  to = "/.netlify/functions/reporting-feedback"
  status = 200

[[redirects]]
  from = "/api/wrapped/reporting/reports"
  to = "/.netlify/functions/reporting-reports"
  status = 200

[[redirects]]
  from = "/api/wrapped/reporting/reports/:id"
  to = "/.netlify/functions/reporting-reports?id=:id"
  status = 200

[[redirects]]
  from = "/api/wrapped/company-report"
  to = "/.netlify/functions/company-report"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
